plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.19.3' apply false
    id 'net.minecraftforge.gradle' version '7.0.40' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// core: plain Java, no Minecraft on its classpath (so nothing version-specific can sneak in).
// Built on its own only for that check and its tests; the loader jars compile its sources directly.
project(':core') {
    apply plugin: 'java'
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    repositories { mavenCentral() }
    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.named('test') { useJUnitPlatform() }
}

// Configures every :<minecraft>:<loader> project. Versions come from versions/<minecraft>/version.properties.
subprojects {
    def loader = name
    if (!(loader in ['fabric', 'forge', 'neoforge'])) return

    def mc = new Properties()
    parent.file('version.properties').withInputStream { mc.load(it) }
    // 26.x and newer ship unobfuscated: no mappings, no remapping.
    def obfuscated = mc.minecraft_version.startsWith('1.')

    apply plugin: 'java'
    version = mod_version
    group = 'com.nonopichy'
    base.archivesName = "capeall-$loader-$mc.minecraft_version"
    java.toolchain.languageVersion = JavaLanguageVersion.of(mc.java_version as int)
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

    // core (no Minecraft code) + common code of this Minecraft version + loader metadata + src/main (entrypoint)
    sourceSets.main {
        java.srcDirs rootProject.file('core/src/main/java'), parent.file('common/src/main/java')
        resources.srcDirs rootProject.file('core/src/main/resources'), rootProject.file("loaders/$loader")
    }

    def props = [version: mod_version, minecraft_version: mc.minecraft_version, java_version: mc.java_version]
    processResources {
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand props }
    }

    if (loader == 'fabric') {
        apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
        def modImplementation = obfuscated ? 'modImplementation' : 'implementation'
        dependencies {
            minecraft "com.mojang:minecraft:$mc.minecraft_version"
            if (obfuscated) mappings loom.officialMojangMappings()
            add modImplementation, "net.fabricmc:fabric-loader:$fabric_loader_version"
            add modImplementation, "net.fabricmc.fabric-api:fabric-api:$mc.fabric_api_version"
        }
    }

    if (loader == 'forge') {
        apply plugin: 'net.minecraftforge.gradle'
        minecraft {
            if (obfuscated) mappings channel: 'official', version: mc.minecraft_version
            runs {
                register('client') {
                    workingDir = layout.projectDirectory.dir('run')
                    args '--mixin.config=capeall.mixins.json'
                }
            }
        }
        repositories {
            minecraft.mavenizer(it)
            maven fg.forgeMaven
            maven fg.minecraftLibsMaven
            mavenCentral()
        }
        dependencies {
            implementation minecraft.dependency("net.minecraftforge:forge:$mc.minecraft_version-$mc.forge_version")
        }
        jar.manifest.attributes('MixinConfigs': 'capeall.mixins.json')
    }

    if (loader == 'neoforge') {
        apply plugin: 'net.neoforged.moddev'
        neoForge {
            version = mc.neoforge_version
            runs { client { client() } }
            mods { capeall { sourceSet sourceSets.main } }
        }
    }
}
